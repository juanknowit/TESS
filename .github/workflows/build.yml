name: Build

# Every push and pull request runs the tests and builds an (unsigned) installer, kept as an artifact.
# To publish a GitHub release, run this workflow from the Actions tab with a version (e.g. 0.9.3-beta),
# or push a tag such as v1.0.0. Versions with a "-", like -beta, are marked as pre-releases.
# Only the Release job can see the signing certificate or write to the repository. See RELEASING.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this version, e.g. 0.9.3-beta or 1.0.0 (leave empty for a test build)"
        required: false
        default: ""

permissions:
  contents: read

# Only pull-request builds replace each other. Builds of main and releases always run to the end,
# so publishing a release never cancels the main build (which drives the README badge).
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release != '' }}

jobs:
  test:
    name: Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
          echo "::notice title=Toolchain::$(sw_vers -productVersion) / $(swift --version 2>&1 | head -1)"

      - name: Run tests
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee test.log; then
            # Surface compiler errors and failed assertions as annotations on the run.
            grep -E "error:|failed \(" test.log | sed -E 's/\x1b\[[0-9;]*m//g' | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
          SUMMARY="$(grep -E "Executed [0-9]+ tests?" test.log | tail -1 | sed -E 's/^[[:space:]]+//')"
          echo "::notice title=Tests::${SUMMARY:-no test summary found}"

  build:
    name: Build TESS
    needs: test
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') || inputs.release != '') }}
    runs-on: macos-15
    env:
      UNIVERSAL: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: scripts/ci-version.sh

      - name: Build and package (unsigned)
        run: scripts/ci-package.sh

      - name: Check release and Dev identities
        run: |
          scripts/ci-check-identity.sh release build.noindex/TESS.app
          UNIVERSAL= ./build.sh --dev
          scripts/ci-check-identity.sh dev "build.noindex/TESS Dev.app"

      - uses: actions/upload-artifact@v5
        with:
          name: TESS-${{ env.TESS_VERSION }}
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: test
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release != '' }}
    runs-on: macos-15
    permissions:
      contents: write # create the tag and the release
    env:
      UNIVERSAL: "1"
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}
      HAS_TESS_SIGNING: ${{ secrets.TESS_SIGNING_P12 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Version
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: scripts/ci-version.sh

      - name: Signing certificate
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_PASSWORD: ${{ secrets.DEVELOPER_ID_PASSWORD }}
          TESS_SIGNING_P12: ${{ secrets.TESS_SIGNING_P12 }}
          TESS_SIGNING_PASSWORD: ${{ secrets.TESS_SIGNING_PASSWORD }}
        run: |
          if [ "$HAS_DEVELOPER_ID" = true ]; then
            scripts/ci-import-certificate.sh DEVELOPER_ID
            { echo "SIGN_HARDENED=1"; echo "NOTARIZE=1"; } >> "$GITHUB_ENV"
          elif [ "$HAS_TESS_SIGNING" = true ]; then
            scripts/ci-import-certificate.sh TESS_SIGNING
          else
            echo "::error title=No signing certificate::Add the TESS_SIGNING_P12 and TESS_SIGNING_PASSWORD secrets before releasing (see RELEASING.md)."
            exit 1
          fi

      - name: Build and package (signed)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/ci-package.sh

      - name: Check release identity
        run: scripts/ci-check-identity.sh release build.noindex/TESS.app

      - name: Release notes
        run: |
          set -o pipefail
          scripts/release-notes.sh "$TESS_VERSION" | tee release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release-notes.md
          prerelease: ${{ contains(env.TESS_VERSION, '-') }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v5
        with:
          name: TESS-${{ env.TESS_VERSION }}
          path: dist/

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
