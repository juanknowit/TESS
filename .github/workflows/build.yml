name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach TESS.zip to releases

jobs:
  build:
    name: Build TESS.app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          swift --version
          echo "::notice title=Toolchain::$(sw_vers -productVersion) / $(swift --version 2>&1 | head -1)"

      - name: Build and package
        run: |
          set -o pipefail
          if ! ./build.sh 2>&1 | tee build.log; then
            # Surface compiler errors as annotations on the run.
            grep -E "error:" build.log | sed -E 's/\x1b\[[0-9;]*m//g' | sort -u | head -40 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Zip app
        # ditto keeps the bundle's permissions and structure intact.
        run: ditto -c -k --keepParent build.noindex/TESS.app TESS.zip

      - uses: actions/upload-artifact@v5
        with:
          name: TESS
          path: TESS.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TESS.zip
          generate_release_notes: true
